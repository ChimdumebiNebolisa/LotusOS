[workspace]
resolver = "2"
members = [
    "crates/lotus-core",
    "crates/lotus-cli",
    "shell/lotus-shell/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
