[package]
name = "lotus-shell"
version.workspace = true
description = "Lotus Shell desktop app for LotusOS workspaces"
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lotus-core = { path = "../../../crates/lotus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
